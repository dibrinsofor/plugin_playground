<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mypy Plugin Playground</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/lib/codemirror.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="workspace">
  <div id="controls">
    <button id="run" title="Run code (Ctrl-Enter)" aria-label="Run code (Ctrl-Enter)">Run Typechecker -&gt;</button>
    <button id="share" aria-label="Share code">Share</button>
    <select id="examples" aria-label="Example list"><option>Select example...</option></select>
    <div class="separator"></div>
    <button class="active" id="tab_editor" title="Show code (Ctrl-Shift-1)" aria-label="Show code (Ctrl-Shift-1)">Code</button>
    <button id="tab_output" title="Show output (Ctrl-Shift-2)" aria-label="Show output (Ctrl-Shift-2)">Output</button>
    <button id="tab_log" title="Show log (Ctrl-Shift-3)" aria-label="Show log (Ctrl-Shift-3)">Log</button>
  </div>

  <div id="surface">
    <div id="editor">
      <div class="file-tabs" role="tablist" aria-label="Source files">
        <div class="file-tab" data-file="main" role="tab" tabindex="0" aria-selected="true">main.py</div>
        <div class="file-tab" data-file="plugin" role="tab" tabindex="-1" aria-selected="false">plugin.py</div>
      </div>
      <textarea id="code">from typing import Any

def bad(x: int) -> Any:
    return str(x)

reveal_type(bad(1))
value: int = bad(1)</textarea>
    </div>
    <div id="output"></div>
    <div id="log"></div>
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/lib/codemirror.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/mode/python/python.js"></script>
  <script>
    const editor = CodeMirror.fromTextArea(document.querySelector("#code"), {
      lineNumbers: true,
      mode: "python",
      indentUnit: 4,
      tabSize: 4
    });

    const documents = {
      main: editor.getDoc(),
      plugin: new CodeMirror.Doc("", "python")
    };

    function selectFile(tab) {
      const file = tab.dataset.file;
      if (editor.getDoc() !== documents[file]) {
        editor.swapDoc(documents[file]);
      }

      document.querySelectorAll(".file-tab").forEach(fileTab => {
        const active = fileTab === tab;
        fileTab.setAttribute("aria-selected", active);
        fileTab.tabIndex = active ? 0 : -1;
      });

      editor.focus();
    }

    document.querySelectorAll(".file-tab").forEach(tab => {
      tab.addEventListener("click", () => selectFile(tab));
      tab.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          selectFile(tab);
        }
      });
    });

    const panels = {
      editor: document.querySelector("#editor"),
      output: document.querySelector("#output"),
      log: document.querySelector("#log")
    };
    const panelTabs = {
      editor: document.querySelector("#tab_editor"),
      output: document.querySelector("#tab_output"),
      log: document.querySelector("#tab_log")
    };

    function selectPanel(name) {
      Object.entries(panels).forEach(([panelName, panel]) => {
        panel.classList.toggle("active-panel", panelName === name);
        panelTabs[panelName].classList.toggle("active", panelName === name);
      });
      if (name === "editor") editor.refresh();
    }

    Object.entries(panelTabs).forEach(([name, tab]) => {
      tab.addEventListener("click", () => selectPanel(name));
    });

    document.querySelector("#run").addEventListener("click", async event => {
      const button = event.currentTarget;
      button.disabled = true;
      panels.output.textContent = "Checking…";
      panels.log.textContent = "";
      selectPanel("output");

      try {
        const response = await fetch("/check", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({code: documents.main.getValue()})
        });
        const result = await response.json();
        panels.output.textContent = result.stdout || "Success: no type errors found";
        panels.log.textContent = result.stderr || `mypy exited with status ${result.status}`;
      } catch (error) {
        panels.output.textContent = "Type check failed";
        panels.log.textContent = String(error);
        selectPanel("log");
      } finally {
        button.disabled = false;
      }
    });

    selectPanel("editor");
  </script>
</body>
</html>
